name: GITOPS BASED CI DEPLOYMENT

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifests/**'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gitops-webapp:${{ env.SHORT_SHA }}

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: .*gitops-webapp:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/gitops-webapp:${{ env.SHORT_SHA }}|g" manifests/deployment.yaml

      - name: Verify Manifest Change
        run: |
          grep "image:" manifests/deployment.yaml

      - name: Configure Git
        run: |
          git config --global user.name "Omkar052000"
          git config --global user.email "omiipathak2000@gmail.com"

      - name: Commit Manifest Changes
        run: |
          git add manifests/deployment.yaml
          git diff --staged --quiet || git commit -m "Update image tag to ${{ env.SHORT_SHA }}"

      - name: Push Changes
        run: |
          git pull --rebase origin main
          git push origin main
